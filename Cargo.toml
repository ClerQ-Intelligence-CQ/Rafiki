[workspace]
resolver = "2"
members = [
    "engines/sae",
    "engines/spe",
    "engines/be",
    "engines/ade",
    "engines/tse",
    "engines/tambua",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ClerQ Intelligence and Nama Labs"]
license = "Apache-2.0"
repository = "https://github.com/ClerQ-Intelligence-CQ/Rafiki"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
